<!DOCTYPE html>
<html>
<head>
  <title>Partecipazione Digitale</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f7f7f7; }
    .box { background-color: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { color: #333; }
    p { font-size: 18px; }
    img { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>La tua partecipazione digitale</h1>
    <p>Il tuo codice: <strong id="codice">1234-ABCD</strong></p>
    <img id="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=1234-ABCD" alt="QR Code">
  </div>
</body>
</html>
<script src="codice.js"></script>
